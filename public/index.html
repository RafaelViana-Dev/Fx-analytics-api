<!-- public/index.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FX Analytics Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-8">
    <div class="max-w-6xl mx-auto">
        <header class="mb-8 border-b border-gray-700 pb-4">
            <h1 class="text-3xl font-bold text-blue-400">FX Analytics Dashboard</h1>
            <p class="text-gray-400 text-sm mt-1" id="last-update">Atualizando dados...</p>
        </header>

        <!-- Cards de Resumo -->
        <div id="summary-cards" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <!-- Renderizado dinamicamente via JS -->
        </div>

        <!-- Gráfico de Volatilidade -->
        <div class="bg-gray-800 p-6 rounded-lg shadow-lg border border-gray-700">
            <h2 class="text-xl font-semibold mb-4">Análise de Volatilidade e Variação</h2>
            <canvas id="volatilityChart" height="100"></canvas>
        </div>
    </div>

    <script>
        async function fetchAnalytics() {
            try {
                const response = await fetch('http://localhost:3000/currencies/analytics');
                if (!response.ok) throw new Error('Falha na rede');
                const result = await response.json();
                renderDashboard(result);
            } catch (error) {
                console.error('Erro ao buscar dados da API:', error);
                document.getElementById('last-update').innerText = 'Erro de conexão com a API Rest.';
            }
        }

        function renderDashboard(result) {
            // Atualiza Timestamp
            const date = new Date(result.timestamp).toLocaleString('pt-BR');
            document.getElementById('last-update').innerText = `Última atualização: ${date}`;

            // Renderiza Cards
            const cardsContainer = document.getElementById('summary-cards');
            cardsContainer.innerHTML = result.data.map(currency => `
                <div class="bg-gray-800 p-6 rounded-lg shadow-lg border-l-4 ${getRiskColor(currency.riskLevel)}">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-2xl font-bold">${currency.code}</span>
                        <span class="text-sm bg-gray-700 px-2 py-1 rounded">RISCO ${currency.riskLevel}</span>
                    </div>
                    <div class="text-gray-400 text-sm mb-4">${currency.name}</div>
                    <div class="text-3xl font-mono text-green-400 mb-2">R$ ${currency.currentPrice.toFixed(2)}</div>
                    <div class="flex justify-between text-xs text-gray-500">
                        <span>Max: ${currency.highPrice.toFixed(2)}</span>
                        <span>Min: ${currency.lowPrice.toFixed(2)}</span>
                    </div>
                </div>
            `).join('');

            // Renderiza Gráfico
            renderChart(result.data);
        }

        function getRiskColor(riskLevel) {
            const colors = {
                'BAIXO': 'border-green-500',
                'MEDIO': 'border-yellow-500',
                'ALTO': 'border-red-500'
            };
            return colors[riskLevel] || 'border-gray-500';
        }

        function renderChart(data) {
            const ctx = document.getElementById('volatilityChart').getContext('2d');
            const labels = data.map(c => c.code);
            const variations = data.map(c => c.variation);

            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Variação Diária (%)',
                        data: variations,
                        backgroundColor: variations.map(v => v >= 0 ? 'rgba(34, 197, 94, 0.6)' : 'rgba(239, 68, 68, 0.6)'),
                        borderColor: variations.map(v => v >= 0 ? 'rgb(34, 197, 94)' : 'rgb(239, 68, 68)'),
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { color: '#374151' },
                            ticks: { color: '#9CA3AF' }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: '#9CA3AF' }
                        }
                    },
                    plugins: {
                        legend: { display: false }
                    }
                }
            });
        }

        // Inicializa a aplicação
        fetchAnalytics();
    </script>
</body>
</html>
